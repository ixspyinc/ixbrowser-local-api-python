name: Release Package to PyPI
on:
  push:
    tags:
      - '*'

jobs:
  test:
    name: Test before release (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .

      - name: Run tests
        # Only the offline suite. tests/test_official_doc_contract.py is opt-in, so
        # an upstream documentation change can never block a release.
        run: python -m pytest -q

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        # Build dependencies (setuptools, wheel, packaging) are declared in
        # pyproject.toml [build-system] and installed by `build` in an isolated env.
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        env:
          # Passed through the environment, never interpolated into the script,
          # so a crafted tag name cannot inject shell commands. setup.py rejects
          # tags that are not valid PEP 440 versions.
          TAG: ${{ github.ref_name }}
        run: |
          echo "Building version from tag: $TAG"
          rm -rf build dist ixbrowser_local_api.egg-info
          python -m build
          twine check --strict dist/*

      - name: Publish distribution 📦 to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_TOKEN }}
